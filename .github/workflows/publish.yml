---
# Wheels are py3-none-<platform>: the ctypes binding never touches the CPython ABI,
# so one wheel per platform covers every supported Python version.
name: Publish

# Must stay a top-level workflow. PyPI trusted publishing checks the attestation's
# build config URI against the run's top-level workflow_ref, and those disagree
# whenever this is called as a reusable workflow from another one.
"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string

env:
  PACKAGE_NAME: djot-fmt

jobs:
  goreleaser:
    name: Release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release binaries and publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deploy key for the Homebrew tap push. Unset until
          # scripts/provision-tap-deploy-key.sh has been run, which goreleaser
          # treats as "skip the tap" rather than as a failure.
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}

  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, runner: ubuntu-24.04, container: quay.io/pypa/manylinux_2_28_x86_64}
          - {target: linux-aarch64, runner: ubuntu-24.04-arm, container: quay.io/pypa/manylinux_2_28_aarch64}
          # macos-15-intel is the last x86_64 macOS image, available until August
          # 2027, after which this target cannot be built natively
          - {target: macos-x86_64, runner: macos-15-intel}
          - {target: macos-arm64, runner: macos-15}
          - {target: windows-x86_64, runner: windows-2025}
          - {target: windows-arm64, runner: windows-11-arm}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Wheels must run on macOS releases older than the runner, and the deployment
      # target is what the wheel tag claims.
      - name: Pin the macOS deployment target
        if: startsWith(matrix.target, 'macos')
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      # The arm64 Windows image ships only an x86_64 mingw, which assembles Go's arm64
      # sources with an x86 assembler. cgo needs a gcc-compatible driver, so MSVC cannot
      # stand in for it.
      - name: Install an aarch64 mingw toolchain
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          $release = "20260616"
          $name = "llvm-mingw-$release-ucrt-aarch64"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/$name.zip" -OutFile toolchain.zip
          Expand-Archive -Path toolchain.zip -DestinationPath C:\
          "C:\$name\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC=aarch64-w64-mingw32-gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build wheel
        run: uv build --wheel --out-dir dist
        env:
          BUILD_DATE: ${{ github.event.repository.updated_at }}
          GIT_COMMIT: ${{ github.sha }}

      # The wheel is tagged linux_* at build time because the glibc floor it
      # actually satisfies is only knowable after inspecting the shared library.
      - name: Retag Linux wheels to manylinux
        if: startsWith(matrix.target, 'linux')
        run: |
          uvx auditwheel repair dist/*.whl --wheel-dir repaired
          rm dist/*.whl
          mv repaired/*.whl dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # A wheel that builds is not a wheel that runs. Every platform is exercised against
  # the real index, because a wrongly tagged wheel or a library missing a symbol
  # only shows up on install.
  verify:
    name: Verify ${{ matrix.target }}
    needs: [publish-pypi]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, runner: ubuntu-24.04}
          - {target: linux-aarch64, runner: ubuntu-24.04-arm}
          - {target: macos-x86_64, runner: macos-15-intel}
          - {target: macos-arm64, runner: macos-15}
          - {target: windows-x86_64, runner: windows-2025}
          - {target: windows-arm64, runner: windows-11-arm}
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Resolve the published version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag }}

      # PyPI serves the index through a CDN that lags the upload by up to a few minutes.
      - name: Wait for the release to appear on PyPI
        run: |
          # Arithmetic rather than seq, which Git Bash on the Windows runners lacks
          attempt=1
          while [ "$attempt" -le 20 ]; do
            if uv run --refresh --no-project \
              --with "${PACKAGE_NAME}==${VERSION}" python -c "pass" >/dev/null 2>&1; then
              echo "Available after ${attempt} attempt(s)"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
          echo "::error::${PACKAGE_NAME}==${VERSION} never became installable"
          # Re-run unsuppressed so the log carries the reason
          uv run --refresh --no-project --with "${PACKAGE_NAME}==${VERSION}" python -c "pass"
          exit 1

      - name: Run the console script
        run: |
          printf '  hello  ' > input.txt
          uvx --refresh --from "${PACKAGE_NAME}==${VERSION}" djot-fmt input.txt > actual.txt
          printf 'hello' > expected.txt
          diff -u expected.txt actual.txt

      # The tag carries the raw semver string while Python normalizes the
      # distribution version, so `0.1.0-rc.2` and `0.1.0rc2` name one release.
      # canonicalize_version puts both forms in the same shape before comparing.
      - name: Import the library and check the stamped version
        run: |
          uv run --refresh --no-project --with "${PACKAGE_NAME}==${VERSION}" --with packaging python -c "
          import djot_fmt
          from packaging.utils import canonicalize_version

          expected = canonicalize_version('${VERSION}')
          assert djot_fmt.run('  hello  ') == 'hello', djot_fmt.run('  hello  ')
          assert canonicalize_version(djot_fmt.__version__) == expected, djot_fmt.__version__
          assert canonicalize_version(djot_fmt.go_version().split()[0]) == expected, djot_fmt.go_version()
          print('ok', djot_fmt.go_version())
          "
